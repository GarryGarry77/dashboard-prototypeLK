function layoutFor(){ return M.isDir[R0()]?LAYOUT.dir:LAYOUT.asst; }
function kpiW(t,v,need,st,stt,dl,series,on,star,unit){
  return `<button class="kpi s-${st}" onclick="${on}"><span class="t">${t}<span aria-hidden="true">↗</span></span>
   <span class="v">${fmt(v)}${need!=null?`<small> / ${fmt(need)}${star?'*':''}</small>`:unit?`<small>${unit}</small>`:''}</span>
   <span class="dl">${dl}</span><span class="foot"><span class="st">${st==='ok'?'✓ ':''}${stt}</span>${series?spark(series):''}</span></button>`;
}
function actionsList(){
  const r=R0(), cur=M.rank[r], nr=nextRank(M,r), lo=M.lo[r], pend=pending(M,r), ms=memberStat(M,r), hs=hosStats(M,M.kids[r]);
  const loNeed=M.isDir[r]?RANKS.find(x=>x.c===cur).lo:50, acts=[];
  if(M.isDir[r]){ const Rc=RANKS.find(x=>x.c===cur); if(Rc&&Rc.c!=='Д'){ const ev=M.evalRank(r,Rc); ev.conds.filter(c=>['ЛО','ГО','СОП','СОП*'].includes(c.k)&&c.need&&c.have>=c.need&&(c.have-c.need)<c.need*0.05).forEach(c=>acts.push(['⚠️',`Ранг на грани: ${c.k} ${fmt(c.have)} при пороге ${fmt(c.need)}`,`Запас ${fmt(c.have-c.need)} — если ветка просядет, ${RANK_NAME[cur]} не закроется`,`<button class="btn sm pri" onclick="go('plan')">Проверить</button>`])); } }
  subtree(M,r).filter(x=>!M.isDir[x]&&M.by[x].t==='d'&&M.go[x]>=300).sort((a,b)=>M.go[b]-M.go[a]).slice(0,1).forEach(x=>{ const nb=!M.gens(r).some(g=>g[2]===legOf(M,x)); acts.push(['⭐',`${M.by[x].n}: до Директора ${fmt(500-M.go[x])} ГО`,nb?'Закроется — новая директорская ветвь':'Закроется — плюс Директор в поколениях',`<button class="btn sm pri" onclick="planQuick(${x})">В план</button>`]); });
  const goGap=nr.conds.find(c=>c.k==='ГО'&&!c.ok); if(goGap) acts.push(['📦',`ГО: не хватает ${fmt(goGap.need-goGap.have)}`,`${fmt(pend.total)} баллов в пути засчитаются после доставки`,`<button class="btn sm gh" onclick="go('orders','pend')">В пути</button>`]);
  if(lo<loNeed) acts.push(['🛒',`ЛО: не хватает ${loNeed-lo} баллов`,`Подборка на ${loNeed-lo} баллов — в «Рекомендуем»`,`<button class="btn sm gh" onclick="document.getElementById('w-recs').scrollIntoView({behavior:'smooth',block:'center'})">Подобрать</button>`]);
  if(ms.carts.length) acts.push(['🧺',`${ms.carts.length} брошенных корзин`,`На ${fmt(ms.carts.reduce((a,x)=>a+M.by[x].cart,0))} баллов — напомните, заказ войдёт в ГО`,`<button class="btn sm gh" onclick="go('team','carts')">Открыть</button>`]);
  const mp=acts.slice(0,3);
  if(hs.help.length) mp.push(['💧',`${hs.help.length} ${hs.help.length===1?'потребитель':'потребителя'}: день 45–90 без второго заказа`,'Главная потеря потребителей — между первым и вторым заказом',`<button class="btn sm gh" onclick="go('clients')">Открыть</button>`,true]);
  return mp;
}

function metric(k){
  const r=R0(), p=P();
  if(k==='lo'){ const own=Math.max(1,Math.round(M.lo[r]/24)); let left=M.lo[r]; const rows=[];
    for(let i=0;i<own;i++){ const v=i===own-1?left:Math.round(M.lo[r]/own); left-=v; rows.push([`№48${177+i*13}`,`${2+i*5} окт`,v,i===own-1&&M.by[r].pend?'В пути':'Получен']); }

/* ---------- Окно роста: ЗД → ИД и БД → М (запрос лидеров) ---------- */
function genGo(r,g){ return M.gens(r).filter(x=>x[1]===g).reduce((a,[d])=>a+M.go[d],0); }
function growthWin(){
  const r=R0(), cur=M.rank[r]; if(!M.isDir[r]) return growthAsst();
  const tgt=cur==='ЗД'?'ИД':cur==='БД'?'М':(nextRank(M,r).next||cur);
  const T=RANKS.find(x=>x.c===tgt), C=RANKS.find(x=>x.c===cur);
  const allDirGo=M.gens(r).reduce((a,[d])=>a+M.go[d],0);
  let gains=[];
  if(T.gb>C.gb){ for(let g=C.gb+1; g<=T.gb; g++){ const v=Math.round(genGo(r,g)*GEN_PCT[g-1]/100); gains.push([`Бонус с ${g}-го поколения · ${GEN_PCT[g-1]}%`, v?`≈ +${fmt(v)} у.е.`:'откроется с ростом структуры']); } }
  if(T.inf>C.inf) gains.push([`Бонус бесконечности · ${T.inf}%`,`≈ +${fmt(Math.round(allDirGo*(T.inf-C.inf)/100))} у.е.`]);
  if(tgt==='ИД') gains.push(['Награждение на сцене и в журнале','с Золотого директора — дальше выше']);
  if(tgt==='М') gains.push(['Мастерские каникулы и Президентский приём','при специальных условиях']);
  const nr=M.evalRank(r,T); const miss=nr.conds.filter(c=>!c.ok&&!c.exempt);
  const okN=nr.conds.length-miss.length;
  const sum=gains.reduce((a,[,v])=>a+(+(String(v).match(/\+([\d\s ]+)/)||[0,'0'])[1].replace(/\D/g,'')||0),0);
  return `<div class="card grow s7"><div class="gw-h"><span class="gw-b">Окно роста</span><div class="gw-r">${RK(cur)} <span>→</span> ${RK(tgt)}</div></div>
   <h3 class="gw-t">${tgt===cur?`Удержите «${RANK_NAME[cur]}»`:`До «${RANK_NAME[tgt]}» — ${okN} из ${nr.conds.length} условий`}</h3>
   ${sum?`<div class="gw-sum">≈ +${fmt(sum)} у.е. в месяц <small>к вашему бонусу при той же структуре</small></div>`:''}
   <div class="gw-cols"><div><div class="gw-k">Что откроется</div>${gains.map(([a,b])=>`<div class="gw-i"><span class="ok">＋</span><span>${a}<small>${b}</small></span></div>`).join('')}</div>
    <div><div class="gw-k">Чего не хватает</div>${miss.map(c=>`<div class="gw-i"><span class="no">•</span><span>${c.k}<small>${fmt(c.have)} из ${fmt(c.need)}${c.star?'*':''}</small></span></div>`).join('')||'<div class="gw-i"><span class="ok">✓</span><span>Все условия выполнены</span></div>'}</div></div>

function growthWin(){ // те же правила, сумма считается числом, без разбора строк
  const r=R0(), cur=M.rank[r]; if(!M.isDir[r]) return growthAsst();
  const tgt=cur==='ЗД'?'ИД':cur==='БД'?'М':(nextRank(M,r).next||cur), T=RANKS.find(x=>x.c===tgt), C=RANKS.find(x=>x.c===cur);
  const gains=[]; let sum=0;
  for(let g=C.gb+1; g<=T.gb; g++){ const v=Math.round(genGo(r,g)*GEN_PCT[g-1]/100); sum+=v; gains.push([`Бонус с ${g}-го поколения · ${GEN_PCT[g-1]}% с ГО Директоров`, v?`сейчас там ${M.gens(r).filter(x=>x[1]===g).length} Дир., ГО ${fmt(genGo(r,g))} → ≈ +${fmt(v)} у.е.`:`в ${g}-м поколении пока нет Директоров — откроется с ростом`]); }
  if(T.inf>C.inf){ const all=M.gens(r).reduce((a,[d])=>a+M.go[d],0), v=Math.round(all*(T.inf-C.inf)/100); sum+=v; gains.push([`Бонус бесконечности · +${String(T.inf-C.inf).replace('.',',')}%`,`с ГО всех Директоров (${fmt(all)}) → ≈ +${fmt(v)} у.е. до вычета бесконечности нижестоящих Мастеров`]); }
  if(tgt==='ИД') gains.push(['Награждение на событиях','с Золотого директора']);
  if(tgt==='М') gains.push(['Мастерские каникулы и Президентский приём','при выполнении специальных условий']);
  const ev=M.evalRank(r,T), miss=ev.conds.filter(c=>!c.ok&&!c.exempt), okN=ev.conds.length-miss.length;
  return `<div class="card grow"><div class="gw-h"><span class="gw-b">Окно роста</span><div class="gw-r">${RK(cur)} <span>→</span> ${RK(tgt)}</div></div>

    <div><div class="gw-k">Чего не хватает</div>${miss.map(c=>`<div class="gw-i"><span class="no">•</span><span>${c.k}<small>${fmt(c.have)} из ${fmt(c.need)}${c.star?'*':''} · не хватает ${fmt(c.need-c.have)}</small></span></div>`).join('')||'<div class="gw-i"><span class="ok">✓</span><span>Все условия выполнены</span></div>'}</div></div>

function gaugeSvg(v,net){ const a=Math.PI, r=62, cx=80, cy=78; const pt=t=>[cx+r*Math.cos(a+t*a), cy+r*Math.sin(a+t*a)];
  const arc=(t0,t1)=>{const [x0,y0]=pt(t0),[x1,y1]=pt(t1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};
  const t=Math.max(0,Math.min(1,v/100)); const [nx,ny]=pt(t); const [mx,my]=pt(net/100);
  return `<svg width="160" height="92" viewBox="0 0 160 92" aria-hidden="true"><path d="${arc(0,1)}" style="stroke:var(--line)" stroke-width="16" fill="none"/><path d="${arc(0,t)}" style="stroke:var(--good)" stroke-width="16" fill="none"/>
   <line x1="${mx.toFixed(1)}" y1="${(my-10).toFixed(1)}" x2="${mx.toFixed(1)}" y2="${(my+10).toFixed(1)}" style="stroke:var(--gray)" stroke-width="2"/>
   <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" style="stroke:var(--ink)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" style="fill:var(--ink)"/></svg>`; }

/* ---------- Зона риска: Директора структуры на грани ---------- */
function riskList(){ const r=R0(); const out=[];
  M.gens(r).forEach(([x,g])=>{ if(M.exempt[x]) return; const need=RANKS.find(q=>q.c===M.rank[x])?.lo||50;
    if(M.go[x]<550) out.push({x,g,why:`ГО ${fmt(M.go[x])} — запас ${fmt(M.go[x]-500)} до порога 500`,lvl:M.go[x]<520?'high':'mid'});
    else if(M.lo[x]<need+5) out.push({x,g,why:`ЛО ${M.lo[x]} — запас ${M.lo[x]-need} до порога ${need}`,lvl:'mid'}); });
  return out.sort((a,b)=>(a.lvl==='high'?0:1)-(b.lvl==='high'?0:1)); }
function riskW(){ const r=R0(); if(!M.isDir[r]) return '';
  const L2=riskList();
  return `<div class="card c-pad"><div class="hrow"><h3 class="h20">Директора на грани</h3><span class="tag ${L2.length?'t-w':'t-ok'}">${L2.length?L2.length+' в зоне риска':'всё спокойно'}</span></div><div class="sub">Могут не закрыть ранг в октябре. Напишите сейчас — до конца месяца ${daysLeft()} дн.</div>
   ${L2.slice(0,4).map(o=>`<div class="li"><span class="av">${M.by[o.x].n[0]}</span><div class="g1"><b>${M.by[o.x].n}</b><small>${RANK_NAME[M.rank[o.x]]} · ${o.g}-е поколение · ${o.why}</small></div><button class="btn sm ${o.lvl==='high'?'pri':'gh'}" onclick="toast('Открыт чат с ${esc(M.by[o.x].n)}: шаблон «поддержать ранг»')">Написать</button></div>`).join('')||'<div class="sub" style="margin-top:10px">У всех Директоров запас больше 10% от порогов.</div>'}
   ${L2.length>4?`<button class="link" onclick="go('team','branches')">Ещё ${L2.length-4}</button>`:''}
   <div class="note">Правило: ГО меньше 550 или ЛО в пределах 5 баллов от порога ранга. Директора, освобождённые от ГО, не показываем.</div></div>`; }

let rfDone=new Set(LS.get('coral_lk_refiner',[])), rfCur=null, rfScore=null;
function refiner(id,delay){ if(rfDone.has(id)||rfCur) return; setTimeout(()=>{ if(rfDone.has(id)||rfCur) return; rfCur=id; rfScore=null; drawRF(); },delay||1200); }
function drawRF(){ let o=document.getElementById('rf5'); if(!o){ o=document.createElement('div'); o.id='rf5'; document.body.appendChild(o); }
  if(!rfCur){ o.innerHTML=''; return; } const S=SURVEYS[rfCur];
  const scale=S.type==='ces'?['Очень сложно','','','','Очень легко']:['😞','😕','😐','🙂','😍'];
  o.innerHTML=L(`<div class="rf" role="dialog" aria-label="Короткий опрос"><button class="rfx" onclick="rfClose()" aria-label="Закрыть опрос">✕</button>
   ${rfScore===-1?`<div class="rft">Спасибо! Ответ ушёл команде ЛК 💚</div>`:`<b>${S.q}</b>
   <div class="rfs">${[1,2,3,4,5].map(i=>`<button class="${rfScore===i?'on':''}" onclick="rfScore=${i};drawRF()" aria-label="Оценка ${i} из 5">${S.type==='ces'?i:scale[i-1]}</button>`).join('')}</div>
   ${S.type==='ces'?`<div class="rfl"><span>${scale[0]}</span><span>${scale[4]}</span></div>`:''}
   ${rfScore?`<textarea id="rfT" placeholder="${rfScore<=3?S.f:'Что понравилось? (необязательно)'}"></textarea><button class="btn pri sm" onclick="rfSend()">Отправить</button>`:''}`}
   <small class="rfb">опрос · Refiner</small></div>`); }
function rfSend(){ rfDone.add(rfCur); LS.set('coral_lk_refiner',[...rfDone]); rfScore=-1; drawRF(); setTimeout(()=>{ rfCur=null; drawRF(); },1800); }
function rfClose(){ rfDone.add(rfCur); LS.set('coral_lk_refiner',[...rfDone]); rfCur=null; drawRF(); }

function firstLineOf(x,r){ let c=x; while(c!=null&&M.by[c].p!==r) c=M.by[c].p; return c; }
function kpiData(k){ const r=R0(), p=P(), cur=M.rank[r], months=['Июль','Август','Сентябрь','Октябрь'];
  const ser=i=>p.prev.map(x=>x[i]).concat([[0,0,M.lo[r],M.go[r],sopFor(M,r,sopDepthCode())][i]]);
  if(k==='lo'){ const pe=pending(M,r); return {v:M.lo[r],unit:'баллов',need:loNeedOf(r),series:ser(2),months,parts:[['Мои заказы за октябрь',M.lo[r]],['Баллы в пути — пока не входят, засчитаются после доставки',pe.own]]}; }
  if(k==='go'){ const g=groupIds(M,r).filter(x=>!M.isDir[x]&&x!==r), by={}; g.forEach(x=>{ const f=firstLineOf(x,r); if(f!=null) by[f]=(by[f]||0)+M.lo[x]; });
    const parts=[['Ваш ЛО',M.lo[r]],...Object.entries(by).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([f,v])=>[`Ветка ${M.by[f].n}`,v])];
    return {v:M.go[r],unit:'баллов',need:500,series:ser(3),months,parts,check:parts.reduce((a,x)=>a+x[1],0)}; }
  if(k==='sop'){ const Rr=RANKS.find(x=>x.c===sopDepthCode()); const G=M.gens(r).filter(x=>x[1]<=Rr.depth); const gs={}; G.forEach(([d,gen])=>gs[gen]=(gs[gen]||0)+M.go[d]);
    const parts=[['Ваш ГО',M.go[r]],...Object.keys(gs).sort().map(gn=>[`${gn}-е поколение · ${G.filter(x=>x[1]==gn).length} Дир.`,gs[gn]])];
    const s=ser(4); return {v:sopFor(M,r,Rr.c),unit:'баллов',need:Rr.sop,series:s.slice(0,3).every(x=>x)?s:null,months,parts,check:parts.reduce((a,x)=>a+x[1],0)}; }
  if(k==='bonus'){ const b=bonus(M,r,p.prevRank), T=Math.round(b.parts.reduce((a,x)=>a+x.v,0));
    /* округление методом наибольших остатков: слагаемые на экране дают ровно итог */
    const fl=b.parts.map(x=>Math.floor(x.v)); let rest=T-fl.reduce((a,x)=>a+x,0); b.parts.map((x,i)=>[i,x.v-Math.floor(x.v)]).sort((a,c)=>c[1]-a[1]).forEach(([i])=>{ if(rest>0){ fl[i]++; rest--; } });
    return {v:T,unit:'у.е.',need:null,series:null,months,parts:b.parts.map((x,i)=>[x.k,fl[i]]),check:fl.reduce((a,x)=>a+x,0)}; }
  return null; }

/* Бонус: слагаемые округляются методом наибольших остатков — на любом экране сумма строк = итог */
const _bonus7=bonus; bonus=function(){ const b=_bonus7.apply(null,arguments); const T=Math.round(b.parts.reduce((a,x)=>a+x.v,0));
  const fl=b.parts.map(x=>Math.floor(x.v)); let rest=T-fl.reduce((a,x)=>a+x,0);
  b.parts.map((x,i)=>[i,x.v-Math.floor(x.v)]).sort((a,c)=>c[1]-a[1]).forEach(([i])=>{ if(rest>0){ fl[i]++; rest--; } });
  const parts=b.parts.map((x,i)=>Object.assign({},x,{v:fl[i]})); return Object.assign({},b,{parts,total:T,min:T,max:T}); };
