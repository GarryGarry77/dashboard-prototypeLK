<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Club ЛК</title><style>:root{
 --bg:#E5ECEC; --card:#fff; --ink:#004643; --muted:#5F807F; --line:#BFD1D0; --soft:#DCE7E6; --soft2:#EEF3F3;
 --good:#20927B; --good-s:#E3F3EF; --warn:#A8733F; --warn-s:#F8EDE2; --bad:#B4533A; --bad-s:#F7E6E1;
 --gray:#8FA3A2; --accent:#C1905C; --hos:#8A5A2B; --hos-s:#F8EDE2; --hos-l:#E1B382; --r:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Suisse Intl",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:240px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.logo{font-size:21px;font-weight:500;padding:2px 10px 14px}.logo small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);color:var(--muted);text-align:left;width:100%;font-size:14.5px}
.nv svg{width:19px;height:19px;flex:none}
.nv.on{background:var(--soft);color:var(--ink);font-weight:600}
.nv .cnt{margin-left:auto;font-size:11.5px;background:var(--warn-s);color:var(--warn);border-radius:999px;padding:1px 7px;font-weight:600}
.nvh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);padding:12px 10px 4px}
.demo{margin-top:auto;padding:10px;border:1px dashed var(--line);border-radius:var(--r);font-size:12px;color:var(--muted)}
.demo b{display:block;color:var(--ink);margin:2px 0 6px}
.demo .ps{display:flex;flex-direction:column;gap:4px}
.demo .ps button{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);text-align:left;font-size:12.5px}
.demo .ps button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* main */
main{flex:1;min-width:0;padding:20px 30px 90px}
.wrapm{max-width:1240px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.topbar h1 small{display:block;font-size:13.5px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
.per{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px}
.fresh{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.ib{width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);display:grid;place-items:center;position:relative}
.ib .d{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av.lg{width:64px;height:64px;font-size:24px}
/* grid & cards */
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;position:relative}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.link{color:var(--ink);font-size:13px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.sec{grid-column:span 12;display:flex;align-items:baseline;gap:10px;margin:8px 0 -4px;flex-wrap:wrap}
.sec h2{margin:0;font-size:19px;font-weight:600}
.sec span{color:var(--muted);font-size:12.5px}
.sec .r{margin-left:auto}
/* badges */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.bdg.mp{background:var(--soft2);color:var(--ink);border:1px solid var(--line)}
.bdg.hos{background:var(--hos-s);color:var(--hos);border:1px solid var(--hos-l)}
.bdg.plan{background:var(--good-s);color:var(--good);border:1px solid #9fd3c5}
.legend{grid-column:span 12;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:-4px}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:4px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap}
.rk.dir{background:var(--ink);color:var(--card)}
.rk.cons{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--good-s);color:var(--good)}.t-w{background:var(--warn-s);color:var(--warn)}.t-b{background:var(--bad-s);color:var(--bad)}.t-n{background:var(--soft2);color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r);font-weight:600;font-size:13.5px;border:1px solid var(--ink);white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--card)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gh{border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.w{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* metrics */
.m{cursor:pointer;display:flex;flex-direction:column;min-height:150px;border-left-width:4px}
.m:hover{border-color:var(--ink)}
.m .t{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:600}
.m .v{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:10px;white-space:nowrap}
.m .v small{font-size:16px;font-weight:400;color:var(--muted)}
.m .dl{font-size:12.5px;color:var(--muted)}
.m .st{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:600}
.s-ok{border-left-color:var(--good)}.s-ok .st{color:var(--good)}
.s-risk{border-left-color:var(--warn)}.s-risk .st{color:var(--warn)}
.s-no{border-left-color:var(--bad)}.s-no .st{color:var(--bad)}
.s-na{border-left-color:var(--gray)}.s-na .st{color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.mk{position:relative;overflow:visible}
.bar.mk b{position:absolute;top:-3px;width:2px;height:13px;background:var(--accent)}
/* conditions */
.cond{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.cond:first-of-type{border-top:0}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.d-ok{background:var(--good-s);color:var(--good)}.d-risk{background:var(--warn-s);color:var(--warn)}.d-no{background:var(--bad-s);color:var(--bad)}
.cond .r{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
.cond .r b{color:var(--ink)}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .g1{flex:1;min-width:0}
.li small{display:block;color:var(--muted);font-size:12px}
.li .num{font-weight:600;white-space:nowrap}
.act{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:2px}
.act .ic{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;flex:none;font-size:16px;background:var(--soft)}
.act .ic.h{background:var(--hos-s)}
.act .tx{flex:1;font-size:14px;min-width:0}
.act .tx b{font-weight:600}
.act .tx small{display:block;color:var(--muted);font-size:12.5px}
/* tiles */
.tile{cursor:pointer;min-height:112px;display:flex;flex-direction:column}
.tile:hover{border-color:var(--ink)}
.tile .t{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.tile .v{font-size:28px;font-weight:600;margin-top:auto}
.tile .v small{font-size:14px;color:var(--muted);font-weight:400}
.tile .h{font-size:12px;color:var(--muted)}
/* tables */
.tw{overflow:auto;margin:0 -16px;padding:0 16px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td.n,.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
.tb tr.cl{cursor:pointer}.tb tr.cl:hover td{background:var(--soft2)}
.tb .grp td{background:var(--soft2);font-weight:600}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{padding:9px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* planning tree */
.pl-sum{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.pl-sum div{padding:12px;border-left:1px solid var(--line)}
.pl-sum div:first-child{border-left:0}
.pl-sum span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pl-sum b{font-size:20px;font-weight:600;display:block;white-space:nowrap}
.pl-sum em{font-style:normal;font-size:12px;color:var(--muted)}
.pl-sum .up{color:var(--good)}.pl-sum .dn{color:var(--bad)}
.tree .row{display:grid;grid-template-columns:minmax(220px,1fr) 104px 74px 96px 90px;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;position:relative;font-size:13.5px}
.tree .row:hover{background:var(--soft2)}
.tree .row.sel{background:var(--soft)}
.tree .row.pl::after{content:'';position:absolute;right:0;top:0;border-top:14px solid var(--good);border-left:14px solid transparent}
.tree .hd{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;cursor:default;border-top:0}
.tree .hd:hover{background:none}
.tree .nm{display:flex;align-items:center;gap:8px;min-width:0}
.tree .nm .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .nm small{color:var(--muted);font-size:11.5px;display:block}
.tree .tg{width:20px;height:20px;border:1px solid var(--line);border-radius:4px;font-size:13px;line-height:1;flex:none;display:grid;place-items:center;color:var(--muted)}
.tree .sp{width:20px;flex:none}
.tree .n{text-align:right;font-variant-numeric:tabular-nums}
.tree .n small{display:block;font-size:11px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:8px;margin:10px 0}
.stp button{width:38px;height:38px;border-radius:var(--r);background:var(--good);color:#fff;font-size:20px;font-weight:600}
.stp input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:600;border:0;border-bottom:2px solid var(--good);padding:4px;background:transparent}
.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pres button{border:1px solid var(--good);border-radius:var(--r);padding:8px 4px;font-size:11.5px;color:var(--muted);text-align:center}
.pres button b{display:block;font-size:17px;color:var(--ink)}
.pres button.on{background:var(--good);color:#fff}.pres button.on b{color:#fff}
.sw{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--good)}.sw.on::after{left:20px}
.mt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.mt th{background:var(--soft2);font-weight:600;color:var(--muted);font-size:11.5px;padding:6px;text-align:right}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.dn{color:var(--bad)}
/* health */
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--hos-l);border-radius:var(--r);overflow:hidden;background:#fff}
.phase div{padding:12px 14px;border-left:1px solid var(--hos-l)}
.phase div:first-child{border-left:0}
.phase div.on{background:var(--hos-s)}
.phase b{display:block;font-size:14px}
.phase span{font-size:12px;color:var(--muted)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kcol{background:var(--soft2);border-radius:var(--r);padding:10px;min-width:0}
.kcol h4{margin:0 0 2px;font-size:13px}
.kcol p{margin:0 0 8px;font-size:11.5px;color:var(--muted)}
.kc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;margin-top:8px;font-size:13px;cursor:pointer}
.kc:hover{border-color:var(--ink)}
.kc small{display:block;color:var(--muted);font-size:11.5px}
.kc .dbar{height:4px;background:var(--soft);border-radius:2px;margin-top:6px;overflow:hidden}
.kc .dbar i{display:block;height:100%;background:var(--accent)}
.cmp{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.cmp div{flex:1}
.cmp span{display:block;font-size:11.5px;color:var(--muted)}
.cmp b{font-size:24px}
.hbar{position:relative;height:10px;background:var(--soft);border-radius:5px;margin:10px 0 18px}
.hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--hos)}
.hbar em{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.hbar em::after{content:attr(data-l);position:absolute;top:18px;left:-20px;font-size:10.5px;color:var(--muted);font-style:normal;white-space:nowrap}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,40,38,.32);display:none;z-index:30}.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:#fff;z-index:31;transform:translateX(100%);transition:transform .2s;padding:22px;overflow:auto}
.dr.on{transform:none}
.dr h2{margin:0 0 2px;font-size:21px;padding-right:40px}
.x{position:absolute;right:16px;top:16px;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.note{background:var(--soft2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.note b{color:var(--ink)}
.note.h{background:var(--hos-s);color:#7a4f25}
.warn{display:flex;gap:10px;align-items:center;background:var(--warn-s);border:1px solid var(--hos-l);color:#7a4f25;border-radius:var(--r);padding:10px 14px;font-size:13.5px}
/* chat */
.msg{padding:10px 12px;border-radius:12px;font-size:14px;margin:8px 0;max-width:86%}
.me{background:var(--ink);color:var(--card);margin-left:auto}.bot{background:var(--soft2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:var(--r);font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.bnav{display:none}
.fld{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.fld:first-of-type{border-top:0}
.fld .k{width:200px;color:var(--muted);flex:none}
.fld .v{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.e{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--line);font-size:13px;flex:none}
@media (max-width:1180px){
 .c3{grid-column:span 6}.c4,.c5,.c7,.c8,.c9{grid-column:span 12}.c6{grid-column:span 12}
 .pl-sum{grid-template-columns:repeat(4,minmax(0,1fr))}
 .pl-sum div:nth-child(5){border-left:0}.pl-sum div:nth-child(n+5){border-top:1px solid var(--line)}
 .kan{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
 .side{display:none}
 main{padding:14px 14px 96px}
 .g{gap:10px}
 .c2{grid-column:span 6}
 .m{min-height:128px;padding:12px}.m .v{font-size:24px}.m .v small{font-size:13px}
 .topbar h1{font-size:21px}
 .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;justify-content:space-around;z-index:20;box-shadow:0 8px 24px rgba(0,40,40,.12)}
 .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 4px;border-radius:10px;flex:1}
 .bnav button.on{color:var(--ink);font-weight:600}
 .bnav svg{width:21px;height:21px}
 .dr{width:100%;padding:18px}
 .tree .row{grid-template-columns:minmax(0,1fr) 92px 64px;font-size:13px;padding:8px 4px}
 .tree .row .h1,.tree .row .lo{display:none}
 .kan{grid-template-columns:minmax(0,1fr)}
 .fld{flex-wrap:wrap;gap:2px 10px}.fld .k{width:100%}
 .pl-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pl-sum div{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}
 .pl-sum div:nth-child(odd){border-left:0!important}
 .pl-sum div:nth-child(-n+2){border-top:0}
 .pl-sum b{font-size:17px}
 .hide-m{display:none}
}

/* ======================= v3: токены, модульная сетка, современный UI ======================= */
/* Токены сгруппированы как переменные Figma: color/*, radius/*, space/*, type/* — при подключении дизайн-системы меняются только они */
:root{
 --r:12px; --r-s:8px; --r-pill:999px;
 --sh-1:0 1px 2px rgba(0,40,38,.06),0 1px 1px rgba(0,40,38,.04);
 --sh-2:0 8px 24px rgba(0,40,38,.10);
 --focus:0 0 0 3px rgba(32,146,123,.35);
 --t-h:#7a4f25; --t-hs:#F8EDE2;
 --ban1:#004643; --ban2:#0E6B63;
 color-scheme:light;
}
:root[data-theme="dark"]{
 --bg:#0E1716; --card:#15211F; --ink:#E6F0EE; --muted:#93AAA8; --line:#26403C; --soft:#1C2E2B; --soft2:#18272A;
 --good:#4CC3A3; --good-s:#123A31; --warn:#E0A86E; --warn-s:#3A2A19; --bad:#F08A70; --bad-s:#3D1F18;
 --gray:#6F8886; --hos:#E0A86E; --hos-s:#3A2A19; --hos-l:#6B4A28; --t-h:#F1C896; --t-hs:#3A2A19; --ban1:#0B3E3A; --ban2:#14615A; color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --bg:#0E1716; --card:#15211F; --ink:#E6F0EE; --muted:#93AAA8; --line:#26403C; --soft:#1C2E2B; --soft2:#18272A;
 --good:#4CC3A3; --good-s:#123A31; --warn:#E0A86E; --warn-s:#3A2A19; --bad:#F08A70; --bad-s:#3D1F18;
 --gray:#6F8886; --hos:#E0A86E; --hos-s:#3A2A19; --hos-l:#6B4A28; --t-h:#F1C896; --t-hs:#3A2A19; --ban1:#0B3E3A; --ban2:#14615A; color-scheme:dark; } }
body{background:var(--bg);color:var(--ink);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
.card,.side,.dr,.bnav,.per,.ib,.srch,.chip,.tab{background:var(--card)}
.card{border-radius:var(--r);box-shadow:var(--sh-1);border-color:var(--line)}
.btn{border-radius:var(--r-s);min-height:40px}.btn.sm{min-height:34px}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
:root[data-theme="dark"] .btn.pri{color:#0E1716}
.btn.wh{background:#fff;color:#004643;border-color:#fff}.btn.ghw{border-color:rgba(255,255,255,.5);color:#fff}
.nv{border-radius:var(--r-s);min-height:42px}
:where(button,a,input,select,summary):focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.srch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-s);color:var(--muted);font-size:13px;min-width:44px;justify-content:center}
kbd{font:600 11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);background:var(--soft2)}
.tour{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px;box-shadow:var(--sh-1)}
.tour>div:nth-child(2){flex:1;min-width:240px}.tour .ic{font-size:20px}
/* stories (как в мобильных приложениях операторов) */
.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none}
.story .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--accent),var(--good),var(--accent))}
.story .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--card);border:2px solid var(--card);font-size:24px}
.story small{font-size:11.5px;line-height:1.2;text-align:center;color:var(--ink)}
.storyv{padding-top:8px}.sbar{display:flex;gap:4px;margin-bottom:22px}.sbar i{flex:1;height:3px;border-radius:2px;background:var(--line)}.sbar i.on{background:var(--ink)}
.sic{font-size:56px;margin-bottom:12px}.storyv p{font-size:16px;line-height:1.55;color:var(--muted)}
/* модульная сетка: S 1×1, M 2×1, L 2×2, XL 4×1, баннер H 4×1, баннер V 1×2 (в колонках по 3) */
.mg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);grid-auto-flow:row dense;gap:16px}
.w{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;position:relative;box-shadow:var(--sh-1);display:flex;flex-direction:column}
.w-s{grid-column:span 3}.w-m{grid-column:span 6}.w-l{grid-column:span 6;grid-row:span 2}.w-xl{grid-column:span 12}.w-bh{grid-column:span 9}.w-bv{grid-column:span 3;grid-row:span 2}
.w-tall{grid-row:span 2}
.w-ban{padding:0;overflow:hidden;border:0}
.w h3{margin:0;font-size:15px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.w .sub{color:var(--muted);font-size:12.5px}
.big{font-size:22px;font-weight:600;margin:2px 0}.big small{font-size:13px;font-weight:400;color:var(--muted)}
.rkline{font-size:19px;font-weight:600;margin:6px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rkline .arr{color:var(--muted);font-weight:400}
/* KPI */
.w-kpi{padding:0}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:16px;height:100%;border-radius:var(--r);border-left:4px solid var(--gray)}
.kpi:hover{background:var(--soft2)}.kpi:focus-visible{box-shadow:var(--focus)}
.kpi .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.kpi .v{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:10px;white-space:nowrap}
.kpi .v small{font-size:15px;font-weight:400;color:var(--muted)}
.kpi .dl{font-size:12.5px;color:var(--muted)}
.kpi .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:12.5px;font-weight:600}
.kpi.s-ok{border-left-color:var(--good)}.kpi.s-ok .st,.kpi.s-ok .spk{color:var(--good)}
.kpi.s-risk{border-left-color:var(--warn)}.kpi.s-risk .st,.kpi.s-risk .spk{color:var(--warn)}
.kpi.s-no{border-left-color:var(--bad)}.kpi.s-no .st,.kpi.s-no .spk{color:var(--bad)}
.kpi.s-na .st,.kpi.s-na .spk{color:var(--muted)}
.spk{flex:none;opacity:.9}
/* мини-плитки команды */
.tg4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;flex:1}
.mini{display:flex;flex-direction:column;justify-content:space-between;text-align:left;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--soft2);min-height:78px}
.mini:hover{border-color:var(--ink)}.mini span{font-size:12.5px;font-weight:600}.mini b{font-size:24px;font-weight:600}.mini b small{font-size:13px;color:var(--muted);font-weight:400}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.kv3 span{display:block;font-size:12px;color:var(--muted)}.kv3 b{font-size:24px;font-weight:600;display:block}.kv3 small{font-size:11.5px;color:var(--muted)}
.evd{display:flex;align-items:baseline;gap:6px;margin:6px 0}.evd b{font-size:30px}.evd span{color:var(--muted)}
.emo{display:flex;gap:8px}.emo button{font-size:26px;width:46px;height:46px;border-radius:12px;background:var(--soft2);border:1px solid var(--line)}
.emo button:hover{transform:translateY(-2px)}
/* баннеры */
.ban{position:relative;height:100%;color:#fff;display:flex;border-radius:var(--r);background:linear-gradient(120deg,var(--ban1),var(--ban2))}
.ban-h{align-items:stretch}.ban-h .bt{padding:22px;flex:1;display:flex;flex-direction:column;gap:6px;max-width:560px;z-index:1}
.ban b{font-size:22px;line-height:1.2}.ban span{font-size:14px;opacity:.9}.ban .bk{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.ban-v{flex-direction:column;gap:6px;padding:18px;background:linear-gradient(170deg,#A8733F,#C1905C)}
.ban-v b{font-size:20px}
.bx{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:12px;z-index:2}
.art{flex:none}
.art-drops{width:42%;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.35) 0 22px,transparent 23px),radial-gradient(circle at 62% 64%,rgba(255,255,255,.22) 0 40px,transparent 41px),radial-gradient(circle at 80% 26%,rgba(255,255,255,.16) 0 14px,transparent 15px),radial-gradient(circle at 48% 86%,rgba(255,255,255,.12) 0 60px,transparent 61px)}
.art-stick{height:120px;margin:8px 0;background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.18) 0 40%,transparent 41%),linear-gradient(90deg,transparent 42%,#fff 42% 58%,transparent 58%);border-radius:8px;opacity:.9}
/* рекомендации продуктов */
.seg{display:inline-flex;background:var(--soft2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:var(--r-pill);font-size:13px;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.pcar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 2px 4px;scrollbar-width:thin}
.pc{scroll-snap-align:start;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:300px;background:var(--card)}
.pim{height:110px;border-radius:var(--r-s);display:grid;place-items:center;font-size:40px;position:relative;margin-bottom:6px}
.pim em{position:absolute;top:8px;left:8px;font-style:normal;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:var(--r-pill);padding:2px 7px}
.pc b{font-size:14.5px}.pc small{color:var(--muted);font-size:12px}.pc .pr{font-weight:600;font-size:13.5px;margin-top:2px}
.pc .tag{align-self:flex-start}
details summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;margin-top:4px}details summary::before{content:'ⓘ ';}
details p{font-size:12.5px;margin:4px 0 6px;color:var(--ink)}
.t-h{background:var(--t-hs);color:var(--t-h)}
.legend2{font-size:12.5px;color:var(--muted);margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* поиск */
.pin{width:100%;margin-top:12px;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--soft2);color:var(--ink)}
.pres2{margin-top:8px}.pres2 .ph{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin:12px 0 4px}
.pres2 button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-s);font-size:14.5px}
.pres2 button:hover,.pres2 button:focus-visible{background:var(--soft)}
.pres2 small{color:var(--muted);font-size:12px;margin-left:6px}
/* тост с отменой */
.toast{display:flex;align-items:center;gap:14px;pointer-events:auto;border-radius:var(--r-s);box-shadow:var(--sh-2)}
.tu{color:#9FE3CF;font-weight:600;font-size:14px}
/* скелетон */
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--soft2),var(--soft),var(--soft2));background-size:200% 100%;animation:sk 1.1s infinite;min-height:150px}
.skel.h{height:56px;min-height:56px;margin-bottom:16px;max-width:420px}
@keyframes sk{to{background-position:-200% 0}}
/* drawer / bottom sheet */
.dr{border-radius:var(--r) 0 0 var(--r);box-shadow:var(--sh-2)}
@media (max-width:1180px){
 .w-s{grid-column:span 6}.w-m,.w-l,.w-bh{grid-column:span 12}.w-bv{grid-column:span 6}
}
@media (max-width:760px){
 .mg{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(132px,auto);gap:10px}
 .w-s,.w-bv{grid-column:span 1}.w-m,.w-l,.w-xl,.w-bh{grid-column:span 2}.w-l,.w-tall{grid-row:auto}
 .kpi{padding:12px}.kpi .v{font-size:24px}.kpi .v small{font-size:13px}.kpi .t{font-size:12px}.spk{display:none}
 .kv3 b{font-size:20px}
 .art-drops{display:none}.ban b{font-size:19px}
 .dr{top:auto;left:0;right:0;bottom:0;width:100%;max-height:88vh;border-radius:18px 18px 0 0;transform:translateY(100%);padding-top:26px}
 .dr::before{content:'';position:absolute;top:9px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
 .dr.on{transform:none}
 .btn{min-height:44px}.btn.sm{min-height:38px}
 .srch{padding:0;width:36px}
 .tour{font-size:13px}
}
.rk.dir{color:var(--card)}
.me{color:var(--card)}
@media (max-width:760px){ .tour kbd{display:none} }

.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.pg{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:170px;background:var(--soft2)}
.pg small{color:var(--muted);font-size:12.5px}.pgi{font-size:26px}
.wtr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0 6px}
.wtr button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft2);font-size:18px;filter:grayscale(1);opacity:.55}
.wtr button.on{filter:none;opacity:1;background:var(--good-s);border-color:var(--good)}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--good)}
.emo button.on{background:var(--good-s);border-color:var(--good)}
@media (max-width:1180px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ======================= Дизайн-система Coral Club (Figma: Variables (Master), Typography Global, Buttons, Rich components) ======================= */
:root{
 /* st/content/foreground/color/neutral/* */ --ink:#39444c; --muted:#75828b; --gray:#8e9aa4;
 /* st/action/background/color/primary/solid/normal */ --brand:#004c50; --on-brand:rgba(255,255,255,.94);
 /* surfaces */ --bg:#f6f6f6; --card:#ffffff; --soft:#eef1f2; --soft2:#f6f6f6; --line:rgba(57,68,76,.12);
 /* positive / negative / warning / info (onsubtle bg + foreground) */
 --good:#54941e; --good-s:#e3f0dc; --bad:#e03b00; --bad-s:#ffe4dd; --bad-a:#fe582b; --warn:#b86825; --warn-s:#fce6d8; --warn-b:#db7d2e; --info:#726ce7; --info-s:#f9f9fd;
 --hos:#b86825; --hos-s:#fce6d8; --hos-l:#db7d2e; --t-h:#b86825; --t-hs:#fce6d8;
 /* banners: Color/Dark (teal) и Color/Light (pistachio) */ --ban1:#0a9ca7; --ban2:#0a9ca7; --ban-light:#d4e4cb;
 /* st/selectable/borderRadius: x 2, xs 4, pill */ --r:4px; --r-s:4px; --r-x:2px; --r-pill:160px;
 /* elevation/onLight/down/sm */ --sh-1:0 1px 4px rgba(4,8,13,.08),0 1px 2px rgba(4,8,13,.08); --sh-2:0 8px 24px rgba(4,8,13,.12);
 --focus:0 0 0 3px rgba(0,76,80,.28); --accent:#db7d2e;
 --ls:-0.014em;
}
:root[data-theme="dark"]{ --ink:#e7edef; --muted:#9aa7b0; --gray:#7b8892; --brand:#2fb3a8; --on-brand:#06201f; --bg:#0f1416; --card:#161d20; --soft:#1d2629; --soft2:#131a1c; --line:rgba(231,237,239,.12);
 --good:#7cc04a; --good-s:#1b2d14; --bad:#ff7a52; --bad-s:#3a1b12; --warn:#e3a061; --warn-s:#38261a; --hos:#e3a061; --hos-s:#38261a; --hos-l:#8a5a2b; --t-h:#e3a061; --t-hs:#38261a; --ban1:#0b6e75; --ban2:#0b6e75; --ban-light:#25331f; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#e7edef; --muted:#9aa7b0; --gray:#7b8892; --brand:#2fb3a8; --on-brand:#06201f; --bg:#0f1416; --card:#161d20; --soft:#1d2629; --soft2:#131a1c; --line:rgba(231,237,239,.12);
 --good:#7cc04a; --good-s:#1b2d14; --bad:#ff7a52; --bad-s:#3a1b12; --warn:#e3a061; --warn-s:#38261a; --hos:#e3a061; --hos-s:#38261a; --hos-l:#8a5a2b; --t-h:#e3a061; --t-hs:#38261a; --ban1:#0b6e75; --ban2:#0b6e75; --ban-light:#25331f; } }
body{font-family:"Suisse Int'l","Suisse Intl",Inter,Helvetica,Arial,sans-serif;letter-spacing:var(--ls);color:var(--ink);background:var(--bg)}
/* typography: text/heading/* , label/*, body/* */
.topbar h1{font-size:24px;line-height:32px;font-weight:600}
.w h3,.card h3{font-size:16px;line-height:20px;font-weight:500}
.sub,.w .sub,.card .sub{font-size:14px;line-height:20px}
.kpi .v,.m .v{font-size:32px;line-height:40px;color:var(--brand)}
.kpi .t{font-size:14px;line-height:16px;font-weight:500}
.big{color:var(--brand)}
/* buttons: Button Primary / Secondary / Outline — pill */
.btn{border-radius:var(--r-pill);font-weight:500;font-size:16px;line-height:20px;padding:10px 20px;min-height:40px;border:1px solid var(--brand);color:var(--brand)}
.btn.sm{font-size:14px;line-height:16px;padding:8px 14px;min-height:32px}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.gh{border-color:var(--line);color:var(--ink);background:var(--card)}
.btn.acc{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.link{color:var(--brand);border-bottom-color:currentColor}
/* badges: _badge/md — pill 24px, label/sm */
.tag,.bdg{border-radius:var(--r-pill);font-weight:500;font-size:13px;line-height:16px;padding:3px 10px;border:1px solid transparent}
.t-ok{background:var(--good-s);color:var(--good);border-color:var(--good)}
.t-w{background:var(--warn-s);color:var(--warn);border-color:var(--warn-b,var(--warn))}
.t-b{background:var(--bad-s);color:var(--bad);border-color:var(--bad)}
.t-n{background:var(--card);color:var(--muted);border-color:var(--line)}
.bdg.hos,.t-h{background:var(--hos-s);color:var(--hos);border-color:var(--hos-l)}
.bdg.mp{background:var(--card);color:var(--brand);border-color:var(--line)}
/* cards / widgets: radius xs 4, elevation sm, без рамки */
.card,.w{border-radius:var(--r);border:0;box-shadow:var(--sh-1)}
.kpi{border-radius:var(--r)}
.mini,.pg,.kcol,.kc,.pc,.note{border-radius:var(--r)}
.rk.dir,.chip.on,.seg button.on,.demo .ps button.on,.tabs button.on{--x:0}
.rk.dir{background:var(--brand);color:var(--on-brand)}
.chip,.seg,.seg button{border-radius:var(--r-pill)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.demo .ps button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.nv.on{background:var(--soft);color:var(--brand)}
.bar i{background:var(--brand)}
.me{background:var(--brand);color:var(--on-brand)}
/* stories: Stories Item lg — картинка 80 круг, точка непрочитанного */
.story{width:104px}.story .ring{width:80px;height:80px;padding:0;background:var(--soft);position:relative}
.story .ring span{border:0;background:var(--soft);font-size:30px}
.story .ring::after{content:'';position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--bad-a,#fe582b);border:2px solid var(--card)}
.story small{font-size:13px;line-height:16px;font-weight:500}
/* banners: Banner Color/Dark и Color/Light — radius 4, padding 32/36, heading/md */
.ban{border-radius:var(--r);background:var(--ban1)}
.ban-h .bt{padding:32px 36px 36px;max-width:600px}
.ban b{font-size:24px;line-height:32px;font-weight:600}
.ban span{font-size:16px;line-height:24px;opacity:1;color:rgba(255,255,255,.94)}
.ban-v{background:var(--ban-light);color:var(--ink);padding:24px}
.ban-v span,.ban-v .bk{color:var(--ink)}
.ban-v .bx{background:rgba(57,68,76,.1);color:var(--ink)}
.btn.wh{background:#fff;color:var(--brand);border-color:#fff}
.ban-v .btn.wh{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
/* listing item (Rich components) — фон превью #f6f6f6, radius x 2, кнопка-корзина pill */
.pim{background:#f6f6f6!important;border-radius:var(--r-x);height:160px}
.pc{border:0;padding:0;background:transparent}
.pc b{font-size:16px;line-height:20px;font-weight:500}
.pc .pr{font-size:20px;line-height:28px;font-weight:600;color:var(--brand)}
.pim em{background:var(--bad-a,#fe582b)}
/* language/country */
.lc{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);font-size:14px}
.ctry{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r);text-align:left}
.ctry:hover{background:var(--soft2)}.ctry.on{background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}
.ctry span{font-size:20px}.ctry small{margin-left:auto;color:var(--muted)}
.dr{border-radius:var(--r) 0 0 var(--r)}
.side{border-right:1px solid var(--line)}

.pim img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:10px}
.pim em.soon{left:auto;right:8px;background:var(--brand)}
.pc .btns a.btn{flex:none;width:34px;padding:0;justify-content:center}
:root[data-theme="dark"] .pim img{mix-blend-mode:normal}
/* ================= v4: современный слой (MegaFon-подобные контейнеры + Business Pulse из Figma) ================= */
:root{--r-card:20px;--r-tile:16px;--y:#ffe48a;--y-ink:#4a3b00;--vio:#8a4be8;--gr:#6fb33a;--c-lo:#e5675f;--c-go:#7cc75a;--c-sop:#f2c94c;--c-sops:#56b6e8;--bg:#f2f4f5}
:root[data-theme="dark"]{--y:#5a4a12;--y-ink:#ffe9a6;--bg:#0f1416}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--y:#5a4a12;--y-ink:#ffe9a6}}
body{background:var(--bg)}
.wrapm{max-width:1240px}
.card,.w{border-radius:var(--r-card)!important;box-shadow:none!important;border:0!important;background:var(--card)}
.c-pad{padding:20px}
h2.sec{font-size:22px;line-height:28px;font-weight:600;margin:28px 0 12px;display:flex;align-items:center;gap:6px}
h2.sec>button{all:unset;cursor:pointer;color:var(--muted);font-size:20px}
h2.sec .more{margin-left:auto;font-size:14px;font-weight:500;color:var(--brand)}
.g4{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1100px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 12}}
@media (max-width:640px){.g4{gap:12px}.s3{grid-column:span 6}}

/* ---------- Sidebar: группы как в текущем ЛК ---------- */
.side{width:280px}
#nav{display:flex;flex-direction:column;gap:2px}
.ng{border-radius:14px}
.ng>.nv{width:100%}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:14.5px;color:var(--ink);background:none;border:0;cursor:pointer}
.nv:hover{background:var(--soft)}
.nv svg{width:20px;height:20px;flex:none;color:var(--muted)}
.nv.on{background:var(--soft);color:var(--brand);font-weight:600}.nv.on svg{color:var(--brand)}
.nv .chev{margin-left:auto;transition:transform .2s;color:var(--gray);font-size:12px}
.ng.open .nv .chev{transform:rotate(90deg)}
.nsub{display:none;padding:2px 0 6px 42px}
.ng.open .nsub{display:block}
.nsub button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:10px;font-size:13.5px;color:var(--muted);cursor:pointer}
.nsub button:hover{color:var(--ink);background:var(--soft)}
.nsub button.on{color:var(--brand);font-weight:600;background:color-mix(in srgb,var(--brand) 8%,transparent)}
.nnew{font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 7px;background:#e9f6f5;color:#1d7a74;margin-left:auto}
.cnt{margin-left:auto;background:var(--bad-a);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.oldlk{display:flex;gap:8px;align-items:center;margin:14px 6px 4px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:13px;border:0;cursor:pointer;width:calc(100% - 12px)}

/* ---------- Topbar: язык как на coral-club-test ---------- */
.lseg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.lseg button{border:0;background:none;border-radius:99px;padding:5px 10px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.lseg button.on{background:#0f1a1c;color:#fff}
:root[data-theme="dark"] .lseg button.on{background:#e7edef;color:#0f1416}
.ctryb{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink)}

/* ---------- Ранговые карточки по макетам писем E-mail Welcome Chain ---------- */
.rc{position:relative;border-radius:var(--r-card);overflow:hidden;background-size:cover;background-position:center;color:var(--rk-ink);min-height:250px;display:flex;flex-direction:column;padding:22px}
.rc .wm{font-weight:600;font-size:18px;letter-spacing:-.02em;text-align:center}
.rc .lbl{text-align:center;font-size:15px;margin-top:auto;opacity:.9}
.rc .nm{text-align:center;font-size:34px;line-height:1.08;font-weight:400;letter-spacing:-.02em;margin:4px 0 auto}
.rc.frame::after{content:'';position:absolute;inset:12px;border:1.2px solid var(--rk-frame);border-radius:14px;pointer-events:none}
.rc .glass{position:relative;z-index:1;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-radius:14px;padding:12px 14px;color:#24323a;margin-top:14px}
.rc.dark .glass{background:rgba(8,30,26,.55);color:#eaf3ef}
.rc .glass .row1{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500}
.rc .pbar{height:8px;background:rgba(0,0,0,.09);border-radius:99px;margin-top:8px;overflow:hidden}
.rc .pbar i{display:block;height:100%;border-radius:99px;background:var(--rk-acc)}
.rc.dark .pbar{background:rgba(255,255,255,.18)}
.rc .glass .chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rc .glass .chips2 span{font-size:12px;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.06)}
.rc.dark .glass .chips2 span{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
.rc .glass .chips2 .ok{color:#3f7d17}.rc .glass .chips2 .no{color:#b4400f}
.rc .btnr{display:flex;gap:8px;margin-top:10px}
.rc .btnr button{flex:1;border-radius:99px;padding:9px 12px;font-weight:600;font-size:13.5px;border:0;cursor:pointer;background:var(--rk-acc);color:var(--rk-on,#fff)}
.rc .btnr button.o{background:transparent;border:1px solid currentColor;color:inherit}
.rc.sm{min-height:150px;padding:14px}.rc.sm .nm{font-size:19px}.rc.sm .lbl{font-size:12px}.rc.sm .wm{font-size:13px}.rc.sm.frame::after{inset:8px;border-radius:10px}

/* ---------- Кошелёк (Figma Business Pulse) ---------- */
.wal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wal .wb{border:1px solid var(--line);border-radius:var(--r-tile);padding:14px 16px;background:var(--card);text-align:left;cursor:pointer;color:var(--ink)}
.wal .wb span{display:block;font-size:13px;color:var(--muted)}
.wal .wb b{display:flex;gap:8px;align-items:center;font-size:20px;margin-top:4px}
.eye{border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;padding:0}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.inv button{border-radius:12px;padding:12px;font-weight:600;font-size:14.5px;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
.inv .a{background:var(--card);border:1.5px solid var(--gr);color:#3f7d17}
.inv .b{background:var(--gr);border:1.5px solid var(--gr);color:#fff}

/* ---------- «Мой тариф»: показатели с полосами ---------- */
.tar .hd{display:flex;align-items:center;gap:6px}.tar .hd h3{font-size:22px!important;font-weight:600!important;line-height:28px!important}
.tar .hd .chev{font-size:22px;color:var(--ink)}
.tar .meta{font-size:14px;color:var(--muted);margin-top:4px}.tar .meta b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--soft);border-radius:var(--r-tile);padding:14px;text-align:left;border:0;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;min-height:132px}
.tile .t{font-size:15px;font-weight:600}
.tile .v{font-size:15px;margin-top:6px}.tile .v small{color:var(--muted);font-size:13px}
.tile .h{font-size:12px;color:var(--muted);margin-top:2px}
.tile .pb{margin-top:auto;height:12px;background:var(--card);border-radius:99px;overflow:hidden}
.tile .pb i{display:block;height:100%;background:#43b04a;border-radius:99px}
.tile.risk .pb i{background:#f0a23b}.tile.no .pb i{background:#e5675f}
.perk{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:var(--r-tile);padding:14px 16px;margin-top:10px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink)}
.perk .pi{font-size:22px}.perk b{display:block;font-size:15px}.perk small{color:var(--muted);font-size:13px}
.perk .pill{margin-left:auto;background:#efe6ff;color:#6b33c9;border-radius:99px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Цветные плитки задач (Figma: Your ToDo) ---------- */
.todo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.td{background:var(--y);color:var(--y-ink);border-radius:var(--r-tile);padding:14px 16px;min-height:104px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.td .t{display:flex;justify-content:space-between;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.td .v{font-size:28px;margin-top:auto;font-weight:500}.td .v small{font-size:16px;opacity:.75}
.td.vio{background:var(--vio);color:#fff}.td.grn{background:var(--gr);color:#fff}
@media (max-width:900px){.todo{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Действия ---------- */
.acts4{display:flex;flex-direction:column;gap:8px}
.a4{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.a4 .ic{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
.a4 .tx{flex:1;min-width:0}.a4 b{display:block;font-size:14.5px}.a4 small{color:var(--muted);font-size:13px}

/* ---------- Гейдж (как Mega5G) ---------- */
.gauge{display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:var(--r-tile);padding:16px;margin-top:12px}
.gauge p{flex:1;font-size:14px;color:var(--muted);margin:0;line-height:20px}.gauge p b{color:var(--ink);font-size:26px;display:block;line-height:32px}
.gauge svg{flex:none}
.newb{background:#62a8f5;color:#fff;border-radius:10px;padding:5px 12px;font-size:14px;font-weight:500}

/* ---------- Горизонтальные карусели (МегаСемья) ---------- */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-top:12px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hc{flex:0 0 220px;scroll-snap-align:start;background:var(--soft);border-radius:var(--r-tile);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:150px;cursor:pointer;border:0;text-align:left;color:var(--ink)}
.hc .cnt2{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:4px 10px;font-weight:600;font-size:13px;align-self:flex-start}
.hc b{font-size:16px;margin-top:auto}.hc small{color:var(--muted);font-size:13px}
.hc .stp4{display:flex;gap:4px}.hc .stp4 i{flex:1;height:5px;border-radius:99px;background:var(--card)}.hc .stp4 i.on{background:var(--gr)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}.dots i.on{width:26px;background:var(--gr)}

/* ---------- Сторис с фото ---------- */
.st4{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin-bottom:6px}
.st4 button{flex:none;width:86px;border:0;background:none;cursor:pointer;text-align:center;color:var(--ink)}
.st4 .sph{display:block;width:76px;height:76px;border-radius:50%;background-size:cover;background-position:center;margin:0 auto 6px;box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px #fe582b}
.st4 small{font-size:12px;line-height:15px;display:block}

/* ---------- Баннеры с фото ---------- */
.bnr{position:relative;border-radius:var(--r-card);overflow:hidden;background-size:cover;background-position:center;min-height:220px;color:#fff;display:flex}
.bnr .in{position:relative;z-index:1;padding:26px 28px;display:flex;flex-direction:column;gap:8px;max-width:520px}
.bnr::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,40,44,.86) 0%,rgba(0,40,44,.55) 45%,rgba(0,40,44,0) 75%)}
.bnr .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:600}
.bnr b{font-size:26px;line-height:32px;font-weight:600}
.bnr span{font-size:15px;opacity:.92}
.bnr .bb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bnr .bb button{border-radius:99px;padding:10px 18px;font-weight:600;border:0;cursor:pointer;background:#fff;color:#0f2b2d}
.bnr .bb button.o{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff}
.bnr .x{position:absolute;top:12px;right:12px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer}
.bnr.v{min-height:100%;flex-direction:column}.bnr.v::before{background:linear-gradient(0deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 55%,rgba(0,0,0,0) 100%)}
.bnr.v .in{margin-top:auto;padding:20px}.bnr.v b{font-size:22px;line-height:26px}
.bnr .sale{position:absolute;top:14px;left:14px;z-index:2;background:#fe582b;color:#fff;border-radius:99px;padding:4px 10px;font-weight:600;font-size:13px}

/* ---------- Акции (Figma: Active Promotions) ---------- */
.promo{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r-tile);padding:12px 12px 12px 16px;background:var(--card);cursor:pointer;color:var(--ink);text-align:left;width:100%}
.promo .tx{flex:1}.promo .d{display:inline-block;background:#ffe4dd;color:#e03b00;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600}
.promo b{display:block;font-size:15px;font-weight:500;margin-top:10px}.promo small{color:var(--muted);font-size:13px}
.promo .im{width:110px;height:84px;border-radius:12px;background-size:cover;background-position:center;flex:none}

/* ---------- Карточки товаров с реальными фото ---------- */
.pcar4{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.pc4{flex:0 0 220px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-tile);overflow:hidden;display:flex;flex-direction:column}
.pc4 .im{height:150px;background-size:cover;background-position:center;position:relative}
.pc4 .im.pack{background-size:contain;background-repeat:no-repeat;background-color:#f6f6f6}
.pc4 .im em{position:absolute;top:10px;left:10px;font-style:normal;background:#fe582b;color:#fff;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
.pc4 .im .why{position:absolute;bottom:8px;left:8px;font-size:11.5px;background:rgba(255,255,255,.92);color:#24323a;border-radius:99px;padding:3px 9px;font-weight:600}
.pc4 .bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc4 b{font-size:15px}.pc4 small{color:var(--muted);font-size:12.5px}
.pc4 .pr{font-size:20px;line-height:28px;color:var(--brand);font-weight:600;margin-top:4px}
.pc4 .row{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.pc4 .row button,.pc4 .row a{flex:1;border-radius:99px;padding:9px 10px;font-weight:600;font-size:13.5px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer;text-align:center;text-decoration:none}
.pc4 .row a{flex:0 0 40px;background:var(--card);color:var(--brand);padding:9px 0}
.seg4{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg4 button{border:0;background:none;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg4 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- Мелкие карточки ---------- */
.mc{background:var(--card);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mc .k{font-size:13px;color:var(--muted)}.mc b{font-size:16px}
.evd4{display:flex;align-items:baseline;gap:6px}.evd4 b{font-size:34px!important;line-height:1;color:var(--brand)}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* ---------- Разметка: тулбар и фильтры ---------- */
.ptb{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:var(--r-card);padding:14px 16px}
.sinp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;min-width:220px;flex:1;max-width:320px;background:var(--card)}
.sinp input{border:0;outline:0;background:none;flex:1;font:inherit;color:var(--ink);min-width:0}
.gtrack{display:flex;align-items:center;flex:2;min-width:300px;position:relative;padding:0 6px}
.gtrack::before{content:'';position:absolute;left:12px;right:12px;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.gtrack .fill{position:absolute;left:12px;top:50%;height:2px;background:#e5675f;transform:translateY(-50%)}
.gtrack button{position:relative;z-index:1;flex:1;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:6px 0}
.gtrack button i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.gtrack button.in i{background:#e5675f}
.gtrack button.cur i{width:30px;height:30px;background:var(--card);border:2px solid #e5675f;color:#e5675f;font-style:normal;font-weight:600;font-size:13px;display:grid;place-items:center}
.gl{font-size:12px;color:var(--muted);white-space:nowrap}
.sel4{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.fbtn{height:42px;border-radius:12px;padding:0 18px;font-weight:600;border:0;background:#7cc75a;color:#fff;cursor:pointer;display:flex;gap:8px;align-items:center}
.fbtn em{font-style:normal;background:#fff;color:#3f7d17;border-radius:99px;padding:0 7px;font-size:12px}
.fpan{background:var(--card);border-radius:var(--r-card);padding:18px 20px;margin-top:12px}
.fcols{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.4fr;gap:20px}
@media (max-width:900px){.fcols{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.fcols{grid-template-columns:1fr}}
.fcols h4{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--ink)}
.cbx{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0;cursor:pointer}
.cbx input{width:20px;height:20px;accent-color:#e5675f}
.rch{display:flex;flex-wrap:wrap;gap:6px}
.rch button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.rch button.on{background:#e5675f;border-color:#e5675f;color:#fff}
.rng{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:13px}
.rng input{height:34px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;min-width:0}
.ffoot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:16px;padding-top:14px;flex-wrap:wrap}
.ffoot .sp{flex:1}
.b4{border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.b4.red{background:#e5675f;border-color:#e5675f;color:#fff}.b4.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.achips span{display:inline-flex;gap:6px;align-items:center;background:#fdeceb;color:#b3423a;border-radius:99px;padding:4px 6px 4px 10px;font-size:13px;font-weight:500}
.achips span button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px;color:inherit}

/* ================= v5: ясность и контраст (WCAG AA, Apple HIG / Material 3) ================= */
:root[data-theme="dark"]{--info-s:#1e1f36;--info:#a9a5ff;--warn-b:#c9772f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--info-s:#1e1f36;--info:#a9a5ff;--warn-b:#c9772f}}

/* «Ваши задачи»: одна нейтральная поверхность, без подчёркиваний и четырёх фонов. Цвет — только у точки статуса */
.todo .td,.todo .td:nth-child(n){background:var(--card)!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1px var(--line)!important;border-radius:20px}
.todo .td .t{text-decoration:none!important;font-weight:600;font-size:15px;color:var(--ink);align-items:center}
.todo .td .t span{font-size:0;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.todo .td .t span::after{content:'›';font-size:18px;color:var(--muted);line-height:1}
.todo .td .t::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:8px;flex:none;order:-1}
.todo .td .t{justify-content:flex-start}.todo .td .t span{margin-left:auto}
.todo .td:nth-child(2) .t::before{background:var(--bad)}
.todo .td .s2,.todo .td .v3{color:var(--muted)!important;opacity:1!important}
.todo .td .v2 b{color:var(--ink)!important}.todo .td .v2 small{color:var(--muted)}

/* Карточка ранга — «физическая» светлая карточка: текст внутри всегда тёмный */
.rc .glass,.rc .glass *{color:#1f2b31}
.rc .glass .row1 span:last-child,.rc .glass small{color:#4a5a62!important}
.rc .glass .chips2 .ok{color:#2e6b12!important}.rc .glass .chips2 .no{color:#b23a1a!important}
.rc .btnr button.o{color:#1f2b31!important;border-color:rgba(31,43,49,.35)!important;background:rgba(255,255,255,.6)!important}
.rc .btnr button:not(.o){color:#fff!important}
.rlad .it .st{background:#fff!important;color:#1f2b31!important;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rlad .it .wm{padding-right:84px}

/* САП: сплошная поверхность вместо градиента под текстом */
.sap{background:var(--card)!important;box-shadow:inset 0 3px 0 var(--info)}
.sap .gw-t,.sap .sub,.sap .st{color:var(--ink)}.sap .sub,.sap .st{color:var(--muted)!important}

/* Баннеры: картинка отдельно, текст на карточке */
.bn5{position:relative;background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px var(--line)}
.bn5 .img{height:180px;background-size:cover;background-position:center}
.bn5.s4 .img{height:180px}
.bn5 .in{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px}
.bn5 .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.bn5 b{font-size:20px;line-height:26px;font-weight:600;color:var(--ink)}
.bn5 .in>span:not(.k){font-size:14.5px;color:var(--muted);line-height:1.45}
.bn5 .btns{margin-top:8px}
.bn5 .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
@media (min-width:1100px){.bn5.s8{flex-direction:row}.bn5.s8 .img{height:auto;min-height:220px;flex:0 0 46%}.bn5.s8 .in{justify-content:center}}

/* Экстрабонус «выполнено» — семантический зелёный, а не фиолетовый */
.perk .pill{background:var(--good-s)!important;color:var(--good)!important;box-shadow:none!important}
/* фазы Health OS, звёзды, подписи графиков */
.phase{background:var(--card)!important}.phase div:not(.on) b{color:var(--ink)}.phase div:not(.on) span{color:var(--muted)}
.star5{color:var(--muted)!important;opacity:.45}.star5.on{color:#e8a33d!important;opacity:1}
.kc4 .bars i em{color:var(--muted)!important}
.cnt5{background:#d23c1e!important;color:#fff!important}
.stb{color:var(--ink)}

/* Цели месяца и достижения */
.strk{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:16px;padding:12px 14px;margin:10px 0 6px}.strk>span{font-size:26px}.strk small{display:block;color:var(--muted);font-size:12.5px}
.qst{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.qst:first-of-type{border-top:0}
.qst .qi{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.qst.ok .qi{background:var(--good-s);color:var(--good);font-weight:700}
.qst small{display:block;color:var(--muted);font-size:12.5px}
.qb{height:6px;background:var(--soft);border-radius:99px;margin-top:6px;overflow:hidden}.qb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.qst.ok .qb i{background:var(--good)}
.bdg6{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.bg6{border-radius:16px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:2px;opacity:.6}.bg6.on{opacity:1;box-shadow:inset 0 0 0 1px var(--brand)}
.bg6>span{font-size:26px}.bg6 b{font-size:14px}.bg6 small{font-size:12px;color:var(--muted)}

/* Каролина: кнопки действий в ответе */
.kacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kact{all:unset;cursor:pointer;min-height:36px;padding:0 14px;display:inline-flex;align-items:center;border-radius:99px;background:var(--brand);color:#fff;font-weight:600;font-size:13px}
.kact+.kact{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}

/* HIG / Material: зоны нажатия ≥ 44 pt на мобильном */
@media (max-width:760px){
 .btn.sm,.chip,.tabs4 button,.tabs button,.seg4 button,.lseg button,.msg button,.link,.kact,.aiq button{min-height:44px}
 .ib5{width:44px;height:44px}
 .msg button{padding:0 14px}
}

<script>/* ===== Движок маркетинг-плана Coral Club (ред. 17 от 17.05.17, обновлён апрель 2024) =====
   Всё, что видит пользователь, считается здесь из одной структуры. В интерфейсе требования не хранятся. */

const RANKS = [
 // code, name, lo, go, branches, masterBranches, dirs, depth(поколения), sop, star(СОП*), genBonus depth, infinity %
 {c:'ЗвМ',n:'Звёздный мастер',      lo:100,go:null,br:10,mbr:10,dirs:0,depth:6,sop:null,star:true,gb:6,inf:5},
 {c:'ПМ', n:'Платиновый мастер',    lo:100,go:null,br:6, mbr:6, dirs:0,depth:6,sop:null,star:true,gb:6,inf:4.5},
 {c:'ЗМ', n:'Золотой мастер',       lo:100,go:500, br:4, mbr:3, dirs:24,depth:6,sop:null,star:true,gb:6,inf:4},
 {c:'2СМ',n:'Дабл серебряный мастер',lo:100,go:500,br:4, mbr:2, dirs:24,depth:6,sop:null,star:true,gb:6,inf:3},
 {c:'СМ', n:'Серебряный мастер',    lo:100,go:500, br:4, mbr:1, dirs:24,depth:6,sop:18500,star:true,gb:6,inf:2},
 {c:'М',  n:'Мастер',               lo:100,go:500, br:4, mbr:0, dirs:16,depth:6,sop:12500,star:true,gb:6,inf:1},
 {c:'БД', n:'Бриллиантовый директор',lo:70, go:500, br:3, mbr:0, dirs:8, depth:5,sop:6500, star:true,gb:5,inf:0},
 {c:'ИД', n:'Изумрудный директор',  lo:70, go:500, br:3, mbr:0, dirs:4, depth:4,sop:3500, star:false,gb:4,inf:0},
 {c:'ЗД', n:'Золотой директор',     lo:70, go:500, br:2, mbr:0, dirs:2, depth:3,sop:2000, star:false,gb:3,inf:0},
 {c:'СД', n:'Серебряный директор',  lo:50, go:500, br:1, mbr:0, dirs:1, depth:2,sop:null,star:false,gb:2,inf:0},
 {c:'Д',  n:'Директор',             lo:50, go:500, br:0, mbr:0, dirs:0, depth:0,sop:null,star:false,gb:0,inf:0},
];
const RANK_ORDER = ['П','ПП','А','Д','СД','ЗД','ИД','БД','М','СМ','2СМ','ЗМ','ПМ','ЗвМ'];
const RANK_NAME = {П:'Потребитель',ПП:'Премиум-потребитель',А:'Ассистент'};
RANKS.forEach(r=>RANK_NAME[r.c]=r.n);
const GEN_PCT = [10,8,5,5,5,5];          // бонус с поколений, % с ГО Директоров по поколениям
const CONFIRM = c => c==='Д'?1 : RANK_ORDER.indexOf(c)<=RANK_ORDER.indexOf('М')?2:3; // месяцев подряд
const rankIdx = c => RANK_ORDER.indexOf(c);

function compute(nodes, plan){
  plan = plan||{};
  const by = {}, kids = {};
  nodes.forEach(n=>{by[n.id]=n; kids[n.id]=[];});
  nodes.forEach(n=>{ if(n.p!=null && kids[n.p]) kids[n.p].push(n.id); });
  const root = nodes[0].id;
  const lo={}, go={}, isDir={}, exempt={};
  const order=[]; (function walk(id){ order.push(id); kids[id].forEach(walk); })(root);
  const post = order.slice().reverse();
  post.forEach(id=>{ lo[id]=by[id].lo; });
  // ближайшие Директора ниже (1-е поколение) — по уже посчитанным детям
  function gen1(id){ const out=[]; (function d(x){ kids[x].forEach(c=>{ if(isDir[c]) out.push(c); else d(c); }); })(id); return out; }
  // title — «закрытый Директор»: Директор по факту (без льготы) или по данным
  function pass(isNew, title){
    post.forEach(id=>{
      let g=lo[id]; kids[id].forEach(c=>{ if(!isDir[c]) g+=go[c]; });
      go[id]=g;
      // Сноска 3: закрытый Директор освобождается от ГО, когда у него появляется новый Директор в 1-м поколении (ЛО 50 и СОП остаются)
      exempt[id] = !!(title && title[id] && gen1(id).some(c=>isNew(c)));
      isDir[id] = lo[id]>=50 && (g>=500 || exempt[id]);
    });
  }
  pass(()=>false,null);
  const factDir={...isDir};
  const title={}; nodes.forEach(n=>title[n.id]=factDir[n.id]||!!n.title);
  const planned = id=>plan[id]!=null && !factDir[id];
  if(Object.keys(plan).length){
    post.forEach(id=>{ if(plan[id]!=null){ // целевой ГО участника → недостающее добавляем в его ЛО
      let g=lo[id]; kids[id].forEach(c=>{ if(!isDir[c]) g+=go[c]; }); lo[id]+=Math.max(0,plan[id]-g); } });
  }
  const isNew = id => !!by[id].nd || planned(id);
  pass(isNew, title);
  const fact = {isDir:factDir};
  // поколения директоров ниже каждого узла: [id, gen, leg]
  const gens = {};
  function dg(id){
    if(gens[id]) return gens[id];
    const out=[];
    kids[id].forEach(c=>{
      (function down(x, g, leg){
        if(isDir[x]){ out.push([x,g,leg]); kids[x].forEach(k=>down(k,g+1,leg)); }
        else kids[x].forEach(k=>down(k,g,leg));
      })(c,1,c);
    });
    return gens[id]=out;
  }
  const rank = {}, detail = {};
  function rankOf(id){
    if(rank[id]) return rank[id];
    const n=by[id];
    if(!isDir[id]){ rank[id] = n.t==='c'?'П':n.t==='pc'?'ПП':'А'; return rank[id]; }
    const G=dg(id);
    let got='Д';
    for(const R of RANKS){
      if(R.c==='Д') break;
      const ev=evalRank(id,R,G);
      if(ev.ok){ got=R.c; break; }
    }
    rank[id]=got; return got;
  }
  function evalRank(id,R,G){
    G=G||dg(id);
    const within=G.filter(x=>x[1]<=R.depth);
    const legs={};
    within.forEach(([d,g,leg])=>{ legs[leg]=(legs[leg]||0)+go[d]; });
    kids[id].forEach(c=>{ if(!isDir[c]) legs[c]=(legs[c]||0)+go[c]; });
    const dirLegs=new Set(G.map(x=>x[2]));
    const mLegs=new Set(G.filter(x=>rankIdx(rankOf(x[0]))>=rankIdx('М')).map(x=>x[2]));
    const sop = go[id] + within.reduce((a,[d])=>a+go[d],0);
    const legVals=Object.entries(legs).sort((a,b)=>b[1]-a[1]);
    const strong = legVals.length? legVals[0][1]:0;
    const conds=[];
    conds.push({k:'ЛО',need:R.lo,have:lo[id],ok:lo[id]>=R.lo});
    if(R.go) conds.push({k:'ГО',need:R.go,have:go[id],ok:go[id]>=R.go||exempt[id],exempt:exempt[id]&&go[id]<R.go});
    if(R.br) conds.push({k:'Директорские ветви',need:R.br,have:dirLegs.size,ok:dirLegs.size>=R.br});
    if(R.mbr) conds.push({k:'Мастерские ветви',need:R.mbr,have:mLegs.size,ok:mLegs.size>=R.mbr});
    if(R.dirs) conds.push({k:`Директора в ${R.depth} поколениях`,need:R.dirs,have:within.length,ok:within.length>=R.dirs});
    if(R.sop){
      if(R.star){
        const rest=sop-Math.min(strong,sop);
        conds.push({k:'СОП*',need:R.sop,have:sop,ok:sop>=R.sop && rest>=R.sop/2,star:true,rest,strong,half:R.sop/2});
      } else conds.push({k:'СОП',need:R.sop,have:sop,ok:sop>=R.sop});
    }
    return {ok:conds.every(c=>c.ok),conds,sop,strong,legVals,dirLegs:dirLegs.size,mLegs:mLegs.size,dirs:within.length,within};
  }
  order.forEach(rankOf);
  return {by,kids,root,lo,go,isDir,exempt,isNew,rank,gens:dg,evalRank,fact,order,
    sopOf(id){ const r=rank[id]; const R=RANKS.find(x=>x.c===r); const d=R?R.depth:0; return go[id]+dg(id).filter(x=>x[1]<=d).reduce((a,[x])=>a+go[x],0); }};
}

/* Следующий ранг и его условия для пользователя */
function nextRank(M,id){
  const cur=M.rank[id];
  if(!M.isDir[id]){
    return {cur, next:'Д', conds:[
      {k:'ЛО',need:50,have:M.lo[id],ok:M.lo[id]>=50},
      {k:'ГО',need:500,have:M.go[id],ok:M.go[id]>=500}]};
  }
  const i=RANKS.findIndex(r=>r.c===cur);
  const R=RANKS[i-1]; if(!R) return {cur,next:null,conds:[]};
  const ev=M.evalRank(id,R);
  return {cur,next:R.c,conds:ev.conds,ev};
}

/* Предварительный бонус по маркетинг-плану, ред. 17. Проценты — от балловой стоимости заказов */
function lineOf(M,root,id){ let d=0,x=M.by[id]; while(x.id!==root){ d++; x=M.by[x.p]; } return d; }
function bonus(M,id,prevRank){
  const r=M.rank[id], lo=M.lo[id], parts=[], me=M.by[id];
  const isCons=c=>M.by[c].t==='c', isPA=c=>M.by[c].t==='pc'||(M.by[c].t==='d'&&!M.isDir[c]);
  if(!M.isDir[id]){
    // Потребитель / Премиум-потребитель / Ассистент: 5% с заказов первой линии (П, ПП, А)
    const fl=M.kids[id].filter(c=>!M.isDir[c]).reduce((a,c)=>a+M.lo[c],0);
    parts.push({k:'Бонус рекомендаций · 5%',v:fl*0.05,note:`5% с заказов первой линии: ${Math.round(fl)} баллов`});
    const prem=(me.nso||0)>=500;
    if(me.t!=='c') parts.push({k:`${me.t==='pc'?'Возвратная скидка':'Бонус с ЛО'} · ${prem?10:0}%`,v:prem?lo*0.10:0,note:prem?`10% с вашего ЛО ${lo} · НСО ${Math.round(me.nso).toLocaleString(typeof LOC!=='undefined'?LOC:'ru-RU')} ≥ 500`:'10% откроется при НСО 500'});
  } else {
    parts.push({k:'С вашего ЛО · 25%',v:lo*0.25,note:`25% × ${lo}`});
    // Сноска 5: группа до ближайших Директоров
    const g=[]; (function w(x){ M.kids[x].forEach(c=>{ if(!M.isDir[c]){ g.push(c); w(c);} }); })(id);
    const sum=(f)=>g.filter(f).reduce((a,c)=>a+M.lo[c],0);
    const L1=c=>M.by[c].p===id;
    const a=sum(c=>L1(c)&&isCons(c)), b=sum(c=>L1(c)&&isPA(c)), c2=sum(c=>!L1(c)&&isCons(c)), d=sum(c=>!L1(c)&&isPA(c));
    if(a) parts.push({k:'Потребители 1-й линии · 25%',v:a*0.25,note:`25% × ${Math.round(a)}`});
    if(b) parts.push({k:'Премиум и Ассистенты 1-й линии · 15%',v:b*0.15,note:`15% × ${Math.round(b)}`});
    if(c2) parts.push({k:'Потребители 2-й линии и глубже · 20%',v:c2*0.20,note:`20% × ${Math.round(c2)}`});
    if(d) parts.push({k:'Премиум и Ассистенты 2-й линии и глубже · 10%',v:d*0.10,note:`10% × ${Math.round(d)}`});
    const newDir = !!me.nd;
    if(M.go[id]>=750 && (rankIdx(prevRank||'А')>=rankIdx('Д')||newDir)) parts.push({k:'Экстрабонус',v:50,note:'ГО ≥ 750 и Директор+ в прошлом месяце'});
    const R=RANKS.find(x=>x.c===r);
    const G=M.gens(id);
    if(R && R.gb){
      for(let k=1; k<=R.gb; k++){
        const s=G.filter(x=>x[1]===k).reduce((a,[dd])=>a+M.go[dd],0);
        if(s) parts.push({k:`Поколение ${k} · ${GEN_PCT[k-1]}%`,v:s*GEN_PCT[k-1]/100,note:`${GEN_PCT[k-1]}% × ГО Директоров ${Math.round(s).toLocaleString(typeof LOC!=='undefined'?LOC:'ru-RU')}`});
      }
    }
    if(R && R.inf){
      // Бонус бесконечности: с 1-го поколения до ∞, уменьшается на бонус бесконечности нижестоящих Мастеров
      let v=0, tot=0;
      G.forEach(([dd])=>{ let blk=0, x=M.by[dd]; while(x.p!=null && x.p!==id){ const pr=RANKS.find(q=>q.c===M.rank[x.p]); if(pr&&pr.inf) blk=Math.max(blk,pr.inf); x=M.by[x.p]; }
        const rate=Math.max(0,R.inf-blk); v+=M.go[dd]*rate/100; tot+=M.go[dd]; });
      parts.push({k:`Бонус бесконечности · ${R.inf}%`,v,note:`${R.inf}% × ГО Директоров всех поколений ${Math.round(tot).toLocaleString(typeof LOC!=='undefined'?LOC:'ru-RU')}, минус доля нижестоящих Мастеров`});
    }
  }
  const total=parts.reduce((a,p)=>a+p.v,0);
  return {parts,min:total,max:total,total};
}

/* ===== Демо-структуры. Все цифры на экранах считаются движком из этих узлов ===== */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const FN=['Мария','Елена','Ольга','Татьяна','Наталья','Ирина','Светлана','Анна','Юлия','Екатерина','Галина','Людмила','Оксана','Вера','Алина','Дарья','Ксения','Полина','Виктория','Надежда','Лариса','Марина','Жанна','Инна','Валентина','Алексей','Дмитрий','Сергей','Андрей','Игорь','Олег','Павел','Максим','Роман','Виктор','Евгений','Артём','Николай','Владимир','Михаил'];
const LN=['К.','С.','П.','В.','М.','Д.','Л.','Т.','Р.','Г.','Б.','Н.','Ш.','Е.','З.','А.','Ф.','Ч.','О.','Х.'];
const PRODUCTS=['Coral-Mine','Coral-Mine ×3','Набор «Гидратация»','Simag-стик','Mizu-Mine Pure','Coral-Mine + Simag-стик','H-500'];

function build(spec, seed){
  const R=rng(seed); let id=0; const nodes=[];
  const pick=a=>a[Math.floor(R()*a.length)];
  const nm=()=>pick(FN)+' '+pick(LN);
  function hos(){ // история заказов потребителя, дни назад
    const first=Math.floor(8+R()*330);
    const orders=[first];
    const p2=R();
    if(p2<0.62){ // ≈ 59% по сети делают второй заказ
      let gap=Math.floor(35+R()*120); let d=first-gap;
      while(d>0 && orders.length<9){ orders.push(d); gap=Math.floor(28+R()*70); d-=gap; }
    }
    return {orders, water: R()<0.86, product: pick(PRODUCTS)};
  }
  function node(p, n, t, lo, extra){
    const x=Object.assign({id:id++, p, n, t, lo, pend:0, nso: t==='c'?Math.round(40+R()*440): t==='pc'?Math.round(520+R()*2600):Math.round(600+R()*9000), reg:Math.floor(60+R()*1400), last:lo>0?0:1+Math.floor(R()*7), cart:0, consent:R()<0.8, country:'RU'}, extra||{});
    if(t!=='d'){ x.hos=hos(); if(x.lo>0) x.hos.orders.push(Math.floor(R()*20)); x.hos.orders=[...new Set(x.hos.orders)].sort((a,b)=>b-a); }
    nodes.push(x); return x;
  }
  function fill(p, total, k, country){
    if(total<=0) return;
    const w=[]; for(let i=0;i<k;i++) w.push(0.4+R());
    const s=w.reduce((a,b)=>a+b,0); let left=total;
    w.forEach((v,i)=>{
      let lo = i===k-1? left : Math.round(total*v/s); left-=lo;
      const t = R()<0.25?'pc':'c';
      const x=node(p, nm(), t, Math.max(0,lo), {country:country||'RU'});
      if(R()<0.12) x.cart=Math.round(15+R()*45);
      if(R()<0.18) x.pend=Math.round(8+R()*40);
      if(R()<0.16) x.reg=Math.floor(3+R()*27);
    });
    // неактивные: без заказа в этом месяце
    const idle=Math.max(1,Math.round(k*0.3));
    for(let i=0;i<idle;i++){ const x=node(p, nm(), R()<0.5?'c':'d', 0, {country:country||'RU'}); if(R()<0.3) x.cart=Math.round(20+R()*60); }
  }
  (function make(s, p){
    const x=node(p, s.n, s.t||'d', s.lo, {nd:!!s.nd, nso:s.nso||Math.round(3000+R()*60000), pend:s.pend||0, reg:s.reg||Math.floor(200+R()*1500), country:s.country||'RU', consent:true, phone:s.phone});
    if(s.fill) fill(x.id, s.fill[0], s.fill[1], s.country);
    (s.kids||[]).forEach(k=>make(k, x.id));
  })(spec, null);
  return nodes;
}
/* D(имя, ЛО, целевой ГО группы, дети) — директор/партнёр с группой потребителей */
const D=(n,lo,grp,kids,o)=>Object.assign({n,lo,fill:[Math.max(0,grp-lo),Math.max(2,Math.round((grp-lo)/48))],kids:kids||[]},o||{});

const PERSONAS={
 anna:{label:'Анна · Ассистент',name:'Анна Ковалёва',short:'Анна',num:'3104418',country:'Россия',cur:'₽',wallet:'4 870 ₽',transfer:'0,00',

function groupIds(Mx,id){ // моя группа: узлы до ближайших директоров
  const out=[]; (function w(x){ Mx.kids[x].forEach(c=>{ out.push(c); if(!Mx.isDir[c]) w(c); }); })(id); return out; }
function subtree(Mx,id){ const out=[]; (function w(x){ Mx.kids[x].forEach(c=>{out.push(c); w(c);}); })(id); return out; }
function depthOf(Mx,id){ let d=0,x=Mx.by[id]; while(x.p!=null){d++;x=Mx.by[x.p];} return d; }
function legOf(Mx,id){ let x=Mx.by[id]; while(x.p!=null && x.p!==Mx.root){ x=Mx.by[x.p]; } return x.id; }
function pending(Mx,id){ const own=Mx.by[id].pend||0; const grp=groupIds(Mx,id).filter(x=>!Mx.isDir[x]).reduce((a,x)=>a+(Mx.by[x].pend||0),0); return {own,grp,total:own+grp}; }
function memberStat(Mx,id){
  const all=subtree(Mx,id);
  return {all:all.length, active:all.filter(x=>Mx.lo[x]>0).length,
    nw:all.filter(x=>Mx.by[x].reg<30), idle:all.filter(x=>Mx.by[x].last>=2), carts:all.filter(x=>Mx.by[x].cart>0),
    nwMy:Mx.kids[id].filter(x=>Mx.by[x].reg<30), idleMy:Mx.kids[id].filter(x=>Mx.by[x].last>=2), cartsMy:Mx.kids[id].filter(x=>Mx.by[x].cart>0)};
}

function sopFor(Mx,id,rc){ const Rr=RANKS.find(x=>x.c===rc); const d=Rr?Rr.depth:0; return Mx.go[id]+Mx.gens(id).filter(x=>x[1]<=d).reduce((a,[x])=>a+Mx.go[x],0); }
function sopDepthCode(){ // глубина СОП для показа: по рангу-цели, минимум ЗД
  const nr=nextRank(F,F.root); const c=nr.next||M.rank[R0()];

/* ---------- Health OS ---------- */
function clientsOf(Mx,ids){ return ids.filter(x=>['c','pc'].includes(Mx.by[x].t)&&Mx.by[x].hos); }
function hosInfo(n){
  const o=n.hos.orders.slice().sort((a,b)=>b-a); const first=o[0];
  const after=o.filter(d=>d<first);
  const second90 = after.some(d=>first-d<=90);
  const in180 = o.filter(d=>d<=180).length;
  const sub = (n.country==='RO'||isPilot()) && n.id%3!==0;
  return {first, n:o.length, second90, second:after.length>0, loyal: o.filter(d=>first-d<=180).length>=3, in180, water:n.hos.water, product:n.hos.product, last:o[o.length-1], sub, deliveries: sub? 1+(n.id%5):0};
}
function hosStats(Mx,ids){
  const cl=clientsOf(Mx,ids).map(x=>({id:x,n:Mx.by[x],h:hosInfo(Mx.by[x])}));
  const win=cl.filter(c=>c.h.first<=90);
  const mat=cl.filter(c=>c.h.first>90&&c.h.first<=365);
  const s90=mat.filter(c=>c.h.second90).length;
  const nov=cl.filter(c=>c.h.first>180&&c.h.first<=365);
  const loyal=nov.filter(c=>c.h.loyal).length;
  const help=win.filter(c=>c.h.n===1&&c.h.first>=45);
  const subs=cl.filter(c=>c.h.sub); const ret3=subs.filter(c=>c.h.deliveries>=3).length; const subs3=subs.filter(c=>c.h.deliveries>=2).length;
  return {cl,win,mat,s90,rate:mat.length?pct(s90,mat.length):null,nov,loyal,loyRate:nov.length?pct(loyal,nov.length):null,help,
    water:pct(cl.filter(c=>c.h.water).length,cl.length),subs,ret:subs3?pct(ret3,subs3):null};
}

function condRow(c){

  if(c.exempt) return `<div class="cond"><span class="dot d-ok">✓</span><span>${c.k}</span><span class="r">не требуется: <b>новый Директор в 1-м поколении</b></span></div>`;

const LAYOUT={
 asst:['rank','lo','go','active','bonus','actions','link','bh','recs','newbies','team','hos','bv','learn','events','money','csat'],
